<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werewolf Tracker</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f5f5f5;
  margin:0;
}

h1{
  margin:10px;
}

#controls{
  margin:10px;
}

button{
  font-size:16px;
  padding:8px 12px;
  margin:5px;
}

table{
  width:98%;
  margin:10px auto;
  border-collapse:collapse;
  background:white;
}

th, td{
  border:1px solid #ccc;
  padding:6px;
  font-size:14px;
}

input[type="text"]{
  width:90%;
  font-size:14px;
}

.dead{
  background:#ddd;
  text-decoration:line-through;
}

.status-box{
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}
</style>
</head>

<body>

<h1>🐺 Werewolf Tracker</h1>

<div id="controls">
  <button onclick="addPlayer()">➕ Add Player</button>
</div>

<table id="playerTable">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Alive</th>
      <th>Role</th>
      <th>Ghost Vote</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
let playerCount = 0;

function addPlayer(){
  playerCount++;

  const table = document.querySelector("#playerTable tbody");
  const row = document.createElement("tr");

  row.innerHTML = `
    <td>${playerCount}</td>

    <td>
      <input type="text" placeholder="Player ${playerCount}">
    </td>

    <td>
      <button onclick="toggleAlive(this)">🟢 Alive</button>
    </td>

    <td>
      <select>
        <option>Villager</option>
        <option>Werewolf</option>
        <option>Soldier</option>
        <option>Seer</option>
      </select>
    </td>

    <td>
      <select>
        <option value="no" selected>No</option>
        <option value="yes">Yes</option>
      </select>
    </td>

    <td class="status-box">
      <label>
        <input type="checkbox">
        🛡️ Protected
      </label>
      <label>
        <input type="checkbox">
        🎯 Targeted
      </label>
    </td>
  `;

  table.appendChild(row);
}

function toggleAlive(button){
  const row = button.closest("tr");

  if(button.innerText.includes("Alive")){
    button.innerText = "🔴 Dead";
    row.classList.add("dead");
  } else {
    button.innerText = "🟢 Alive";
    row.classList.remove("dead");
  }
}
</script>

</body>
</html>
